[project]
name = "demo-kit"
version = "0.1.0"
description = "Dictably T-000 demo-kit: transcribe → minutes → HTML"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12",
  "pydantic>=2.7",
  "httpx>=0.27",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.52"]
# local ASR is heavy — not for demos (no diarization); prefer assemblyai
local = ["faster-whisper>=1.1"]

[project.scripts]
demo = "demo_kit.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demo_kit"]

[tool.uv]
package = true

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: Typer Argument/Option in defaults is idiomatic
# E501: HTML/CSS template strings in render.py
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
