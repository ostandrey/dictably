# CI: web + demo-kit + backend (T-001/T-002). No deploy.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      demokit: ${{ steps.filter.outputs.demokit }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            web:
              - 'web/**'
              - '.github/workflows/ci.yml'
            demokit:
              - 'tools/demo-kit/**'
              - '.github/workflows/ci.yml'
            backend:
              - 'backend/**'
              - 'infra/**'
              - '.github/workflows/ci.yml'

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    # T-011 e2e: Playwright starts API via webServer; needs Postgres + Redis.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dictably
          POSTGRES_PASSWORD: dictably
          POSTGRES_DB: dictably
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dictably -d dictably"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://dictably:dictably@127.0.0.1:5432/dictably
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.18.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Sync backend (API for Playwright webServer)
        working-directory: backend
        run: |
          uv sync --locked --group dev
          uv run alembic upgrade head
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm i18n:check
      - run: pnpm build:local
      - name: nginx -t without API host (B1)
        working-directory: web
        run: sh scripts/nginx-config-test.sh
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Playwright e2e
        run: pnpm exec playwright test
        env:
          DATABASE_URL: postgresql+asyncpg://dictably:dictably@127.0.0.1:5432/dictably
          REDIS_URL: redis://127.0.0.1:6379/0
      - name: Lighthouse (CI perf ≥ 90; a11y/bp/seo ≥ 95)
        run: pnpm lh
        env:
          CI: true
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web/playwright-report
          if-no-files-found: ignore

  # S3: OpenAPI client must match backend schema (runs when web or backend changes)
  api-client:
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v6
        with:
          version: 10.18.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Sync backend + web deps
        run: |
          cd backend && uv sync --locked --group dev
          cd ../web && pnpm install --frozen-lockfile
      - name: Regenerate API client and fail if dirty
        working-directory: web
        run: |
          pnpm gen:api
          git diff --exit-code src/lib/api

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dictably
          POSTGRES_PASSWORD: dictably
          POSTGRES_DB: dictably_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dictably -d dictably_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://dictably:dictably@127.0.0.1:5432/dictably_test
      TEST_DATABASE_URL: postgresql+asyncpg://dictably:dictably@127.0.0.1:5432/dictably_test
      REDIS_URL: redis://127.0.0.1:6379/0
      ASR_PROVIDER: fake
      LLM_PROVIDER: fake
      STORAGE_PROVIDER: local
      ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: uv sync --locked --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run pytest

  demo-kit:
    needs: changes
    if: needs.changes.outputs.demokit == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/demo-kit
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # CLI (not gitleaks-action) — avoids private-repo license requirement
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.24.3"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan for secrets
        run: gitleaks detect --source . --verbose --redact
