version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      web-deps:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /tools/demo-kit
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      demo-kit-deps:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
