[project]
name = "dictably"
version = "0.1.0"
description = "Dictably API + worker"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "redis>=5.2",
  "arq>=0.26",
  "structlog>=24.4",
  "httpx>=0.27",
  "email-validator>=2",
  "joserfc>=1.0",
  "python-multipart>=0.0.12",
  "anthropic>=2.3.0",
  "python-docx>=1.2.0",
  "weasyprint>=70.0",
  "boto3>=1.43.122",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dictably"]

[tool.hatch.build.targets.wheel.force-include]
"src/dictably/assets" = "dictably/assets"

[tool.uv]
package = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
