services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dictably
      POSTGRES_PASSWORD: dictably
      POSTGRES_DB: dictably
    # Host port offset — avoids collision with local postgresql-x64 on 5432 (B1).
    # Bind localhost only (MVP-0 demo S1) — not reachable from LAN.
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - dictably_pg:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dictably -d dictably"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # Host port offset — avoids collision with local/WSL redis on 6379 (B1).
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../backend
    # Optional secrets / ASR+LLM keys — never commit; defaults stay fake (B1).
    env_file:
      - path: ../backend/.env
        required: false
    environment:
      # Docker network overrides host URLs that may be in backend/.env
      DATABASE_URL: postgresql+asyncpg://dictably:dictably@postgres:5432/dictably
      REDIS_URL: redis://redis:6379/0
      STORAGE_PROVIDER: local
      LOCAL_STORAGE_PATH: /data/storage
      ENV: dev
      DEV_LOGIN: "1"
      PUBLIC_APP_URL: http://127.0.0.1:3000
      COOKIE_SECURE: "0"
      TRUSTED_PROXY_HOPS: "1"
      # ASR_PROVIDER / LLM_PROVIDER / *_API_KEY: from env_file if set; else Settings defaults (fake)
    volumes:
      - dictably_storage:/data/storage
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn dictably.main:app --host 0.0.0.0 --port 8000"

  worker:
    build:
      context: ../backend
    env_file:
      - path: ../backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://dictably:dictably@postgres:5432/dictably
      REDIS_URL: redis://redis:6379/0
      STORAGE_PROVIDER: local
      LOCAL_STORAGE_PATH: /data/storage
      ENV: dev
    volumes:
      - dictably_storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["arq", "dictably.worker.settings.WorkerSettings"]

  # Static export + nginx /api proxy → api:8000. Host http://127.0.0.1:3000
  web:
    build:
      context: ../web
      args:
        LOCAL_BUILD: "1"
        NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
        NEXT_PUBLIC_CONTACT_EMAIL: owner@example.com
        NEXT_PUBLIC_CONTROLLER_NAME: Local Dev, Ukraine
    environment:
      PORT: "80"
      API_UPSTREAM: api:8000
      NGINX_RESOLVER: 127.0.0.11
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - api

volumes:
  dictably_pg:
  dictably_storage:
